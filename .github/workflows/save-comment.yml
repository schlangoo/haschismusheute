name: Kommentar speichern

on:
  repository_dispatch:
    types: [save_comment]
  workflow_dispatch:
    inputs:
      article:
        description: 'Artikel'
        required: true
      comment:
        description: 'Kommentar'
        required: true

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Kommentar speichern
        run: |
          if [ -f comments.json ]; then
            python3 -c "
import json
with open('comments.json', 'r') as f:
    try:
        data = json.load(f)
    except:
        data = []
data.append({'article': '${{ github.event.client_payload.article || github.event.inputs.article }}', 'comment': '${{ github.event.client_payload.comment || github.event.inputs.comment }}'})
with open('comments.json', 'w') as f:
    json.dump(data, f, ensure_ascii=False, indent=2)
"
          else
            python3 -c "
import json
with open('comments.json', 'w') as f:
    json.dump([{'article': '${{ github.event.client_payload.article || github.event.inputs.article }}', 'comment': '${{ github.event.client_payload.comment || github.event.inputs.comment }}'}], f, ensure_ascii=False, indent=2)
"
          fi

      - name: Hochladen
        run: |
          git config user.name "KommentarBot"
          git config user.email "bot@haschismus-heute.org"
          git add comments.json
          git diff --staged --quiet || git commit -m "Kommentar"
          git push
