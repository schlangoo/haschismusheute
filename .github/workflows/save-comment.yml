name: Kommentar speichern

on:
  repository_dispatch:
    types: [save_comment]
  workflow_dispatch:  # NEU: Ermöglicht manuelles Testen!

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Kommentar zu comments.json hinzufügen
        run: |
          echo "Artikel: ${{ github.event.client_payload.article }}"
          echo "Kommentar: ${{ github.event.client_payload.comment }}"
          
          if [ -f comments.json ]; then
            python3 -c "
import json
with open('comments.json', 'r') as f:
    try:
        data = json.load(f)
    except:
        data = []
data.append({'article':'${{ github.event.client_payload.article }}','comment':'${{ github.event.client_payload.comment }}','date':'${{ github.event.client_payload.date }}'})
with open('comments.json', 'w') as f:
    json.dump(data, f, ensure_ascii=False, indent=2)
print('✅ Kommentar hinzugefügt')
"
          else
            echo '[{"article":"${{ github.event.client_payload.article }}","comment":"${{ github.event.client_payload.comment }}","date":"${{ github.event.client_payload.date }}"}]' > comments.json
            echo "✅ comments.json erstellt"
          fi
          
      - name: Änderungen hochladen
        run: |
          git config user.name "KommentarBot"
          git config user.email "bot@haschismus-heute.org"
          git add comments.json
          git diff --staged --quiet || git commit -m "Neuer Kommentar"
          git push
          echo "✅ Hochgeladen!"
