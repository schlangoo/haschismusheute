name: 📝 Verarbeite Kommentare aus Issues

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  process-issues:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Requests installieren
        run: pip install requests
      
      - name: Issues verarbeiten
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/process_issues.py
      
      - name: Änderungen committen
        run: |
          git config user.name "KommentarBot"
          git config user.email "bot@haschismus-heute.org"
          git add comments.json
          git diff --staged --quiet || git commit -m "✊ Kommentare aus Issues aktualisiert"
          git push
