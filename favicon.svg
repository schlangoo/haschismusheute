<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="transparent"/>
  
  <!-- H mit zwei senkrechten Balken und einem waagerechten in der Mitte -->
  <!-- Linker Balken -->
  <rect x="25" y="15" width="12" height="70" fill="#111111"/>
  <!-- Rechter Balken -->
  <rect x="63" y="15" width="12" height="70" fill="#111111"/>
  <!-- Waagerechter Balken in der Mitte -->
  <rect x="25" y="40" width="50" height="12" fill="#111111"/>
  
  <!-- Roter Stern in der oberen Öffnung (zwischen den Balken über dem waagerechten Strich) -->
  <polygon points="50,22 53,28 60,29 54,34 56,41 50,37 44,41 46,34 40,29 47,28" fill="#c00000"/>
</svg>
