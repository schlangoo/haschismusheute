<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="transparent"/>
  
  <!-- Linker senkrechter Balken des H -->
  <rect x="22" y="15" width="16" height="70" rx="2" fill="#111111"/>
  
  <!-- Rechter senkrechter Balken des H -->
  <rect x="62" y="15" width="16" height="70" rx="2" fill="#111111"/>
  
  <!-- Waagerechter Mittelbalken des H -->
  <rect x="22" y="42" width="56" height="16" rx="2" fill="#111111"/>
  
  <!-- Roter Stern in der oberen Öffnung (zwischen den Balken, über dem Mittelbalken) -->
  <!-- Die Öffnung geht von x=38 bis x=62, und von y=15 bis y=42 -->
  <polygon points="50,20 54,29 64,30 56,36 59,46 50,41 41,46 44,36 36,30 46,29" fill="#c00000"/>
</svg>
