<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="transparent"/>
  
  <!-- Linker senkrechter Balken - vom unteren Rand bis kurz unter den oberen Rand -->
  <rect x="18" y="8" width="20" height="84" rx="1" fill="#111111"/>
  
  <!-- Rechter senkrechter Balken -->
  <rect x="62" y="8" width="20" height="84" rx="1" fill="#111111"/>
  
  <!-- Waagerechter Mittelbalken -->
  <rect x="18" y="44" width="64" height="12" rx="1" fill="#111111"/>
  
  <!-- Roter Stern - exakt in der oberen Öffnung (x=38 bis 62, y=8 bis 44) -->
  <!-- Weder links/rechts noch oben/unten wird ein Balken berührt -->
  <polygon points="50,14 54,25 64,26 56,32 59,42 50,37 41,42 44,32 36,26 46,25" fill="#c00000"/>
</svg>
